<!doctype html><html><head><meta charset="utf-8"><title>ai-mirror demo app</title>
<style>body{font-family:system-ui;background:#111;color:#eee;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{background:#1b1b1b;padding:40px;border-radius:14px;width:520px;box-shadow:0 8px 40px #000}
h1{font-size:22px;margin:0 0 20px}label{display:block;margin:14px 0 6px;font-size:13px;color:#9ad}
input,select{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #333;background:#0d0d0d;color:#eee}
button{margin-top:20px;padding:12px 22px;font-size:16px;border:0;border-radius:8px;background:#2e8b57;color:#fff;cursor:pointer}
#out{margin-top:20px;padding:14px;border-radius:8px;background:#0d0d0d;min-height:24px;font-family:monospace;color:#7fd}</style></head>
<body><div class="card"><h1>Order form &mdash; driven by an agent</h1>
<label for="name">Customer</label><input id="name" placeholder="name">
<label for="qty">Quantity</label><input id="qty" type="number" value="1">
<label for="plan">Plan</label><select id="plan"><option>Basic</option><option>Pro</option><option>Enterprise</option></select>
<button id="go">Place order</button><div id="out">no order yet</div></div>
<script>document.getElementById('go').onclick=()=>{const n=document.getElementById('name').value||'(blank)';
document.getElementById('out').textContent=`ORDER OK: ${n} x${qty.value} on ${plan.value}`;};</script></body></html>
