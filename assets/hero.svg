<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">ai-mirror. Your agent gets the keyboard. You keep the off switch.</title>
<desc id="desc">A cream and forest-green identity. A real Hyprland desktop with a red AGENT CONTROL indicator in the top bar, an agent cursor clicking a button, and a kill-switch key combination.</desc>
<rect width="1440" height="820" rx="16" fill="#f4f0e7"/>
<g transform="translate(68 62)">
  <rect x="7" y="14" width="20" height="36" rx="2" fill="none" stroke="#202925" stroke-width="3"/>
  <path d="M32 8V56" stroke="#a7b59f" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="37" y="14" width="20" height="36" rx="2" fill="#577a60"/>
</g>
<text x="156" y="106" fill="#202925" font-family="sans-serif" font-weight="700" font-size="42" letter-spacing="-1.4">ai-mirror</text>
<text x="1372" y="100" fill="#577a60" font-family="monospace" font-size="16" text-anchor="end" letter-spacing="2">NIXARCHY / HYPRLAND / MCP</text>
<text x="72" y="224" fill="#202925" font-family="sans-serif" font-weight="600" font-size="60" letter-spacing="-2">Your agent gets the keyboard.</text>
<text x="72" y="298" fill="#577a60" font-family="sans-serif" font-weight="600" font-size="60" letter-spacing="-2">You keep the off switch.</text>
<g transform="translate(72 360)">
  <rect width="1296" height="340" rx="10" fill="#202925"/>
  <rect width="1296" height="44" rx="10" fill="#161d1a"/>
  <rect y="34" width="1296" height="10" fill="#161d1a"/>
  <g fill="#9bada0" font-family="monospace" font-size="14">
    <text x="24" y="28">1  2  3  4</text>
    <text x="640" y="28" text-anchor="middle">12:07</text>
  </g>
  <rect x="1010" y="10" width="170" height="24" rx="4" fill="#3a1f1f"/>
  <circle cx="1028" cy="22" r="5" fill="#d9534f"/>
  <text x="1042" y="27" fill="#e07a76" font-family="monospace" font-size="14" letter-spacing="1">AGENT CONTROL</text>
  <g fill="#64766a"><circle cx="1210" cy="22" r="4"/><circle cx="1236" cy="22" r="4"/><circle cx="1262" cy="22" r="4"/></g>
  <g transform="translate(40 76)">
    <rect width="560" height="232" rx="6" fill="#2b3530"/>
    <text x="22" y="38" fill="#b0c7a0" font-family="monospace" font-size="16">$ claude</text>
    <text x="22" y="72" fill="#c4cfc5" font-family="monospace" font-size="15">&gt; Open the invoice form in Firefox,</text>
    <text x="22" y="96" fill="#c4cfc5" font-family="monospace" font-size="15">  fill it from invoice.pdf and submit.</text>
    <text x="22" y="138" fill="#9bada0" font-family="monospace" font-size="14">● control  mode=agent</text>
    <text x="22" y="162" fill="#9bada0" font-family="monospace" font-size="14">● a11y_find  role=entry name=Amount</text>
    <text x="22" y="186" fill="#9bada0" font-family="monospace" font-size="14">● a11y_act  set_text "1 240.00"</text>
    <text x="22" y="210" fill="#9bada0" font-family="monospace" font-size="14">● input  click Submit · screenshot</text>
  </g>
  <g transform="translate(640 76)">
    <rect width="616" height="232" rx="6" fill="#e2e8da"/>
    <rect width="616" height="30" rx="6" fill="#c9d4c2"/>
    <rect y="24" width="616" height="6" fill="#c9d4c2"/>
    <text x="16" y="21" fill="#304c35" font-family="monospace" font-size="13">example.com/invoices/new</text>
    <g fill="#304c35" font-family="sans-serif" font-size="15">
      <text x="30" y="72">Customer</text><text x="30" y="122">Amount</text>
    </g>
    <rect x="150" y="54" width="420" height="28" rx="3" fill="#f6f8f1" stroke="#a1b49c"/>
    <text x="162" y="74" fill="#202925" font-family="sans-serif" font-size="15">Freund Cloud Ltd</text>
    <rect x="150" y="104" width="420" height="28" rx="3" fill="#f6f8f1" stroke="#577a60" stroke-width="2"/>
    <text x="162" y="124" fill="#202925" font-family="sans-serif" font-size="15">1 240.00</text>
    <rect x="450" y="168" width="120" height="38" rx="4" fill="#577a60"/>
    <text x="510" y="193" fill="#fff" font-family="sans-serif" font-weight="600" font-size="16" text-anchor="middle">Submit</text>
    <path d="M520 186L520 226L530 214L543 230L550 224L537 208L555 205Z" fill="#b86d4d" stroke="#202925" stroke-width="1.5"/>
  </g>
</g>
<text x="72" y="764" fill="#59675c" font-family="monospace" font-size="16" letter-spacing=".5">YOUR REAL DESKTOP. ANY MCP AGENT. ALWAYS VISIBLE, ALWAYS STOPPABLE.</text>
<g transform="translate(1100 736)">
  <rect width="268" height="42" rx="5" fill="none" stroke="#a7b59f"/>
  <text x="134" y="27" fill="#304c35" font-family="monospace" font-size="17" text-anchor="middle">Super + Shift + Esc</text>
</g>
</svg>
